# pipeline.yaml — the gathering process behind the corpora.
#
# Read fresh by the `pipeline` tool on every call: lane edits land without a
# server restart. All numbers are computed live from the files named here
# (line counts, 24h timestamp scans, state-file keys) — nothing cached.
#
# Lane fields:
#   name / label      identity
#   corpus            the corpus this lane feeds (enables corpus-arrival rates)
#   status            active | complete | paused | blocked
#   queue_file        file(s) of work items still pending -> queued
#   queue_minus_done  queued = lines(queue_file) - lines(done_file)
#   done_file         file of completed work items -> done
#   rate_ts_field     timestamp field counted over the last 24h -> rate_per_24h
#   rate_from_corpus  rate = corpus arrivals over the last 24h
#   target            total work items: int, or {json: state file, key: dotted}
#   queued falls back to max(target - done, 0) when there is no queue_file
#
# A blocked lane carries name/label/status ONLY — no reasons recorded here.
# Discrepancies are measured facts: what the sources report vs what is held.

lanes:
  - name: courts-capture
    label: Court & tribunal judgment PDFs
    corpus: courts
    status: active
    queue_file: /opt/data/court-scraper/queue.jsonl
    done_file: /opt/data/court-scraper/done.jsonl
    rate_ts_field: last_try

