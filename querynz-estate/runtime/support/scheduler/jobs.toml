# THE JOB CATALOGUE — every `qv4-` job type the scheduler may run, and the
# rules for sharing the graphics cards (plan step 2.4, "The nine rules").
#
# A job declares what it needs (docs/contracts/job.md): `needs` is
# "model-profile" with a `profile` from profiles.toml, or "processor";
# `memory_gb` is per parallel worker, MEASURED from run records, never
# computed; `deadline_s` is longer than its work and shorter than its
# interval; `query_timeout_s` sits under the deadline so a job killed at its
# deadline does not leave its query running. `class` is rule 8: "waiting"
# (someone is waiting), "due" (by a time), "whenever" (bulk).
# `requires` names the programs the box must have: node1 once lacked the page
# reader and blanked the totals for 17 days with the board green.
# A timetable is `every_s` or `at_utc` (HH:MM UTC, one or a list; both
# clocks hold local time): it lives here, in the queue, not in a timer on
# one box (step 2.12). `nice` is the child's niceness.
# `wanted` makes a standing service (step 2.13). `pieces` cuts a job into
# pieces that each record progress (rule 7); the command then takes the
# piece key as its last argument.
#
# THE CHAIN RUNS ITSELF (31 October, Arthur 08:40: "a pipeline that is
# continuously gathering, ingesting, OCRing and reading names"). A pieced
# job may name `pieces_command`, a command list the worker runs in the
# job's environment when a row is claimed with no pieces listed; it prints
# one piece key a line and the lines are the row's pieces (none: the row is
# done at once, "nothing waiting", and holds no card). A job may name
# `then = ["qv4-x", ...]`: when a row of it finishes, one row of each is
# queued (class whenever, no pieces) unless one is queued or running already.
# A pieced row runs `concurrency` pieces AT ONCE, cut to the profile's
# `streams` (profiles.toml) less the other rows' pieces in flight on the same
# server; `threads` says how many requests one piece keeps open itself (the
# hansard reader's --threads), so concurrency x threads <= streams is checked.
# `concurrency` still caps the ROWS of the type a worker runs at once per
# card holding the profile, so the server sees at most concurrency x rows
# pieces of one type, and the runner keeps the sum under `streams`.
#
# Hard limit 23: every name carries qv4-. `python -m support.scheduler check`
# refuses a catalogue that breaks a rule.

version = 1

[queueing]
slice_seconds = 3600          # rule 2: a job keeps its card for up to an hour while it has work
drain_not_kill = true         # rule 3
min_queue_to_evict = 8        # rule 5's floor until the profile's load time is measured
max_wait_seconds = 1800       # rule 6: a small job gets its card after 30 minutes regardless
piece_seconds = 300           # rule 7: a piece is a few minutes
due_horizon_seconds = 7200    # rule 8: a due job goes ahead of bulk work this close to its time
memory_reserve_gb = 16        # step 2.5: kept for the database and the standing services. 40 until 1 November 2026, when it counted Flash-Next's host pool (31 GB, 30 October); Radiance's memory, the n-gram table in RAM included (~88 GB), is already out of MemAvailable, so the 40 held back what was not there: with 33 GB available nothing new was claimed from 20:31
lease_seconds = 90            # step 2.8: a running job renews its lease well inside this
policy = "priority-ordered-round-robin"

# THE STANDING SERVER'S NIGHT WINDOW (ruling 129, 30 October 2026). Flash-Next
# on Radiance holds both of node2's cards (56.0 GB over the two, measured 30
# October) and the page reader (4.8 GB) fits on neither beside it: card 0 had
# 2.3 GB free and card 1 4.2 GB. So between these local hours, when a job on
# `profile` is queued and no piece of a view on `standing` (text-reader,
# review) is running or leased, the card manager stops the standing server's
# unit, waits until the cards no longer hold its model, and loads `profile`
# on `card` for the queued pieces; the standing server's OTHER card is held
# reserved meanwhile, so the frozen product's OCR server (querynz-vision-ocr,
# :8032, 4.7 GB over both cards, never touched) keeps its room. When the page
# queue is empty, or a text-reader or review piece is due, or the window ends,
# whichever is first, the manager unloads `profile`, starts the unit again and
# waits for the model to read back. The OTHER card: since 30 October the page
# profile loads beside the frozen OCR server there too when the card's free
# memory, measured after the stop, covers it (cards.py; spec.md on rule 25).
# Arthur's word moves the hours without a commit: `python -m support.scheduler
# night open [--until HH:MM]` and `night close` (night.py). Every stop and start is a swap-ledger
# line with its reason and the measured seconds (Radiance starts in 21.6 s).
# Outside the window the standing server is never stopped or planned (ruling
# 121). The frozen release runs at 06:15 NZDT and never calls Flash-Next. The
# hours are local time in `timezone`, so the clock change moves nothing here.
[night_window]
start_local = "22:00"   # ruling 129 (opened from 15:00 on Arthur's word on 30 October for the page backlog; restored 21:20)
end_local = "05:45"
timezone = "Pacific/Auckland"
standing = "flash-next"
profile = "page-reader"
card = 1

# Step 2.9: the cards the carve-out holds. The planner never evicts these.
# Ruling 121 (29 October 2026): the frozen chat model (querynz-agent-llm,
# :8020) left the carve-out, and qv4-radiance holds both of node2's cards
# as the standing profile flash-next, which the planner never plans (inside
# the night window above the card manager, not the planner, takes them for
# the page reader and gives them back). The frozen OCR server
# (querynz-vision-ocr, :8032) keeps its room inside Radiance's
# --gpu-headroom-mib on each card, so no card is reserved here.
# node1 is out (ruling 55); a reservation for it goes here when it returns.

# ── the founding jobs, on the queue's clock (step 2.12) ─────────────────────
# Installed by the founding session as systemd timers on node2 (local time,
# NZDT = UTC+13 until 5 April 2027); here in UTC, with the deadlines the
# units carried and a query limit under each. The installer supersedes the
# timers: a `.timer` whose job is timetabled here is disabled, and the clock
# is handed over so nothing runs twice. When the clocks change, these times
# move with them or they drift an hour against the old estate's jobs.

